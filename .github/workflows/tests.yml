# Runs the bot's tests whenever its code changes, so a broken update shows up as a red cross here
# instead of as missed alerts.
name: Tests

on:
  push:
    branches: [master]
    paths: ["**.py", "config.json", ".github/workflows/tests.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # GITHUB_ACTIONS is unset so the PC-only features (desk mode, fast lane, auto-buy) get tested too
      - run: env -u GITHUB_ACTIONS python -m unittest discover -s tests
        env:
          TZ: Australia/Melbourne
          BOT_CHAIN_SHOPS: "off"      # tests never read the real JB Hi-Fi site (its own tests switch it back on, faked)
