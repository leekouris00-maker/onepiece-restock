# Runs the One Piece restock bot on GitHub's computers, so it keeps checking when your PC is off.
name: Restock check

on:
  schedule:
    - cron: "*/5 * * * *"    # every 5 minutes (GitHub may run these late)
  workflow_dispatch:          # adds a "Run workflow" button so you can test it any time

permissions:
  contents: write             # lets it save seen.json back to the repo

concurrency:
  group: restock              # never two checks at once
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Make sure tcg_bot.py is the cloud-ready version
        run: grep -q DISCORD_WEBHOOK_BOXES tcg_bot.py || { echo "::error::tcg_bot.py is an old version - upload the newest one"; exit 1; }

      - name: Check shops
        env:
          DISCORD_WEBHOOK_BOXES: ${{ secrets.DISCORD_WEBHOOK_BOXES }}
          DISCORD_WEBHOOK_SINGLES: ${{ secrets.DISCORD_WEBHOOK_SINGLES }}
          DISCORD_PING: ${{ secrets.DISCORD_PING }}
          BOT_NAME: "One Piece Restock (cloud)"
          TZ: Australia/Melbourne
        run: python tcg_bot.py

      - name: Remember what's in stock (seen.json)
        run: |
          git config user.name "restock-bot"
          git config user.email "restock-bot@users.noreply.github.com"
          git add seen.json
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "Update seen.json"
          git pull --rebase
          git push
