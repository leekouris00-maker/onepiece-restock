# One-off test, only on the test/gametraders branch: how the bot should read Gametraders Modbury Heights.
# No secrets, so it can't post anywhere.
name: Test Gametraders shop

on:
  push:
    branches: [test/gametraders]

permissions:
  contents: write             # saves the output to this test branch (diag_output.txt)

jobs:
  test:
    if: "!contains(github.event.head_commit.message, '[output]')"
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python diag_gametraders.py > diag_output.txt 2>&1 || true
          echo "=== full box check, every shop (dry run) ===" >> diag_output.txt
          python tcg_bot.py --sealed --all --dry-run >> diag_output.txt 2>&1 || echo "EXIT $?" >> diag_output.txt
        env:
          TZ: Australia/Melbourne
      - run: |
          git config user.name "restock-bot"
          git config user.email "restock-bot@users.noreply.github.com"
          git add diag_output.txt
          git commit -m "Test output [output]"
          git push
